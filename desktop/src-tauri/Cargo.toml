[package]
name = "xiaomo-desktop"
version = "0.1.0"
description = "小莫资源库 桌面端"
authors = ["xiaomo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xiaomo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 体积优化：release 构建激进裁剪
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
