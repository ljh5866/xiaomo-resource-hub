<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      p {
        margin: 0 0 10px;
        color: #666;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        flex: 1;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: #1a56db;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      a {
        color: #1a56db;
        font-size: 12px;
      }
      #out {
        margin-top: 10px;
        font-size: 12px;
        color: #16a34a;
        word-break: break-all;
      }
      #out.err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>小莫资源网 · 网盘绑定助手</h1>
    <p>把浏览器里的夸克登录态交给小莫资源网，解锁直链直出。</p>
    <div class="row">
      <button id="go">打开绑定页</button>
      <button id="check" style="background: #f2f2f2; color: #333">检查登录</button>
    </div>
    <div id="out"></div>
    <p style="margin-top: 10px">
      提示：先在这个浏览器登录 <a href="https://pan.quark.cn" target="_blank">pan.quark.cn</a>。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
